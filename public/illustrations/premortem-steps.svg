<svg viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pm-steps-title pm-steps-desc">
  <title id="pm-steps-title">计划敲定前的事前验尸六步</title>
  <desc id="pm-steps-desc">六步依次是：先有可执行草稿、宣布失败已成事实、独立写原因、轮流读出只记录、当场改计划或检查单、留一页已处理的失败原因。</desc>
  <defs>
    <pattern id="pm-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/></pattern>
  </defs>
  <rect width="960" height="390" fill="#f7f3eb"/>
  <rect width="960" height="390" fill="url(#pm-steps-dots)" opacity="0.42"/>

  <text x="48" y="48" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">有草稿再验尸；写完原因必须当场改计划</text>

  <g fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 218 H187"/><path d="M181 213 L188 218 L181 223"/>
    <path d="M324 218 H335"/><path d="M329 213 L336 218 L329 223"/>
    <path d="M472 218 H483"/><path d="M477 213 L484 218 L477 223"/>
    <path d="M620 218 H631"/><path d="M625 213 L632 218 L625 223"/>
    <path d="M768 218 H779"/><path d="M773 213 L780 218 L773 223"/>
  </g>

  <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="44" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="192" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="340" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="488" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="636" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="784" y="104" width="132" height="228" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="110" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="258" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="406" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="554" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="702" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="850" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.14"/>
    <text x="110" y="161" fill="#0f6e6b" font-size="18" font-weight="700">1</text>
    <text x="258" y="161" fill="#0f6e6b" font-size="18" font-weight="700">2</text>
    <text x="406" y="161" fill="#0f6e6b" font-size="18" font-weight="700">3</text>
    <text x="554" y="161" fill="#0f6e6b" font-size="18" font-weight="700">4</text>
    <text x="702" y="161" fill="#0f6e6b" font-size="18" font-weight="700">5</text>
    <text x="850" y="161" fill="#0f6e6b" font-size="18" font-weight="700">6</text>

    <text x="110" y="224" fill="#1c1917" font-size="14" font-weight="600">先有一版</text>
    <text x="110" y="250" fill="#1c1917" font-size="14" font-weight="600">能执行草稿</text>
    <text x="258" y="224" fill="#1c1917" font-size="14" font-weight="600">宣布失败</text>
    <text x="258" y="250" fill="#1c1917" font-size="14" font-weight="600">已成事实</text>
    <text x="406" y="224" fill="#1c1917" font-size="14" font-weight="600">独立写</text>
    <text x="406" y="250" fill="#1c1917" font-size="14" font-weight="600">2–3 条原因</text>
    <text x="554" y="224" fill="#1c1917" font-size="14" font-weight="600">轮流读出</text>
    <text x="554" y="250" fill="#1c1917" font-size="14" font-weight="600">只记录</text>
    <text x="702" y="224" fill="#1c1917" font-size="14" font-weight="600">当场改计划</text>
    <text x="702" y="250" fill="#1c1917" font-size="14" font-weight="600">或检查单</text>
    <text x="850" y="224" fill="#1c1917" font-size="14" font-weight="600">留「已处理</text>
    <text x="850" y="250" fill="#1c1917" font-size="14" font-weight="600">失败原因」</text>
  </g>

  <text x="48" y="368" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">没有草稿先别做；写完却不改计划，就只是多开了十分钟会</text>
  <text x="912" y="368" fill="#78716c" font-size="11" text-anchor="end" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">优先处理可控且高频项</text>
</svg>
