<svg viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oob-steps-title oob-steps-desc">
  <title id="oob-steps-title">碰到可疑急消息的六步处理</title>
  <desc id="oob-steps-desc">六步依次是认出触发条件、结束当前对话、用自己早存的号码找本人、家里提前约暗号、单位把复核写进付款流程，以及已付款后立即联系银行止损并报警。</desc>
  <defs>
    <pattern id="oob-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/></pattern>
  </defs>
  <rect width="960" height="390" fill="#f7f3eb"/>
  <rect width="960" height="390" fill="url(#oob-steps-dots)" opacity="0.42"/>

  <text x="48" y="48" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先离开对方控制的通道，再完成确认或止损</text>

  <!-- Small arrows sit only in the gaps between cards. -->
  <g fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 218 H187"/><path d="M181 213 L188 218 L181 223"/>
    <path d="M324 218 H335"/><path d="M329 213 L336 218 L329 223"/>
    <path d="M472 218 H483"/><path d="M477 213 L484 218 L477 223"/>
    <path d="M620 218 H631"/><path d="M625 213 L632 218 L625 223"/>
    <path d="M768 218 H779"/><path d="M773 213 L780 218 L773 223"/>
  </g>

  <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="44" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="192" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="340" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="488" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="636" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="784" y="104" width="132" height="228" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="110" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="258" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="406" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="554" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="702" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="850" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.14"/>
    <text x="110" y="161" fill="#0f6e6b" font-size="18" font-weight="700">1</text>
    <text x="258" y="161" fill="#0f6e6b" font-size="18" font-weight="700">2</text>
    <text x="406" y="161" fill="#0f6e6b" font-size="18" font-weight="700">3</text>
    <text x="554" y="161" fill="#0f6e6b" font-size="18" font-weight="700">4</text>
    <text x="702" y="161" fill="#0f6e6b" font-size="18" font-weight="700">5</text>
    <text x="850" y="161" fill="#0f6e6b" font-size="18" font-weight="700">6</text>

    <text x="110" y="224" fill="#1c1917" font-size="14" font-weight="600">先认触发</text>
    <text x="110" y="250" fill="#1c1917" font-size="14" font-weight="600">条件</text>
    <text x="258" y="224" fill="#1c1917" font-size="12.5" font-weight="600">说“我马上回你”</text>
    <text x="258" y="250" fill="#1c1917" font-size="14" font-weight="600">结束对话</text>
    <text x="406" y="224" fill="#1c1917" font-size="14" font-weight="600">用早存号码</text>
    <text x="406" y="250" fill="#1c1917" font-size="14" font-weight="600">找本人</text>
    <text x="554" y="224" fill="#1c1917" font-size="14" font-weight="600">家里提前</text>
    <text x="554" y="250" fill="#1c1917" font-size="14" font-weight="600">约好暗号</text>
    <text x="702" y="224" fill="#1c1917" font-size="14" font-weight="600">单位写进</text>
    <text x="702" y="250" fill="#1c1917" font-size="14" font-weight="600">付款流程</text>
    <text x="850" y="224" fill="#1c1917" font-size="14" font-weight="600">已经付了</text>
    <text x="850" y="250" fill="#1c1917" font-size="14" font-weight="600">马上止损</text>
  </g>

  <text x="48" y="368" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">付款、改账户、要验证码或密码、要求保密、催你今天必须办完：命中一条就进入流程</text>
  <text x="912" y="368" fill="#78716c" font-size="11" text-anchor="end" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">单位付款由第二人复核</text>
</svg>
