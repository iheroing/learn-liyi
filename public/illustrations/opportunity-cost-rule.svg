<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oc-rule-title oc-rule-desc">
  <title id="oc-rule-title">机会成本只算次优那一项：电脑例</title>
  <desc id="oc-rule-desc">8000 元够用与 12000 元更好，差价 4000 元要写成这 4000 元能做成的最好那件事。不要把愿望清单加总，也不要把 4000 元重复计入 12000 元总价。选贵的等于放弃便宜那台，外加这 4000 元能做成的最好那件事。</desc>
  <defs>
    <pattern id="oc-rule-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#f7f3eb"/>
  <rect width="960" height="560" fill="url(#oc-rule-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">机会成本只算次优那一项，不是清单加总，也不是把差价再计入总价</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">用课文里的电脑例：8000 元够用，对 12000 元更好</text>

  <!-- two computers + difference -->
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="80" width="240" height="112" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/>
    <text x="168" y="126" fill="#1c1917" font-size="22" font-weight="700" text-anchor="middle">8000 元</text>
    <text x="168" y="154" fill="#57534e" font-size="14" text-anchor="middle">够用的那台</text>

    <rect x="672" y="80" width="240" height="112" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/>
    <text x="792" y="126" fill="#1c1917" font-size="22" font-weight="700" text-anchor="middle">12000 元</text>
    <text x="792" y="154" fill="#57534e" font-size="14" text-anchor="middle">更好的那台</text>

    <line x1="288" y1="136" x2="416" y2="136" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="544" y1="136" x2="672" y2="136" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/>
    <text x="480" y="128" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">差价 4000 元</text>
    <line x1="480" y1="144" x2="480" y2="164" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M474 158 L480 166 L486 158" fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="330" y="170" width="300" height="36" rx="6" fill="#0f6e6b" fill-opacity="0.10" stroke="#0f6e6b" stroke-opacity="0.35"/>
    <text x="480" y="194" fill="#0f6e6b" font-size="13" font-weight="600" text-anchor="middle">写成：这 4000 元能做成的最好那件事</text>
  </g>

  <!-- three accounting cards -->
  <rect x="48" y="224" width="276" height="260" rx="8" fill="#fffdf8" stroke="#b45309" stroke-opacity="0.35"/>
  <rect x="342" y="224" width="276" height="260" rx="8" fill="#fffdf8" stroke="#b45309" stroke-opacity="0.35"/>
  <rect x="636" y="224" width="276" height="260" rx="8" fill="#fffdf8" stroke="#0f6e6b" stroke-opacity="0.45"/>
  <rect x="636" y="224" width="276" height="260" rx="8" fill="#0f6e6b" fill-opacity="0.035"/>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <!-- wrong 1 -->
    <rect x="68" y="244" width="40" height="22" rx="4" fill="#b45309" fill-opacity="0.12"/>
    <text x="88" y="260" fill="#b45309" font-size="12" font-weight="600">错</text>
    <text x="186" y="292" fill="#1c1917" font-size="15" font-weight="600">不要加总愿望清单</text>

    <rect x="76" y="312" width="220" height="112" rx="6" fill="#f7f3eb" stroke="#1c1917" stroke-opacity="0.10"/>
    <text x="186" y="338" fill="#57534e" font-size="13">耳机 ＋ 课程 ＋ 旅行 ＋ …</text>
    <text x="186" y="362" fill="#b45309" font-size="13" font-weight="600">全部加起来当作成本</text>
    <text x="186" y="386" fill="#78716c" font-size="12">同一笔 4000 元算了好几遍</text>
    <text x="186" y="410" fill="#78716c" font-size="12">机会成本只取次优一项</text>

    <text x="186" y="454" fill="#57534e" font-size="12">不是所有放弃项的总和</text>

    <!-- wrong 2 -->
    <rect x="362" y="244" width="40" height="22" rx="4" fill="#b45309" fill-opacity="0.12"/>
    <text x="382" y="260" fill="#b45309" font-size="12" font-weight="600">错</text>
    <text x="480" y="292" fill="#1c1917" font-size="15" font-weight="600">不要把差价重复计入总价</text>

    <rect x="370" y="312" width="220" height="112" rx="6" fill="#f7f3eb" stroke="#1c1917" stroke-opacity="0.10"/>
    <text x="480" y="338" fill="#57534e" font-size="13">「已包含在 12000 里</text>
    <text x="480" y="362" fill="#b45309" font-size="13" font-weight="600">不必另算」</text>
    <text x="480" y="386" fill="#78716c" font-size="12">总价只告诉你要付多少</text>
    <text x="480" y="410" fill="#78716c" font-size="12">没说你做不成哪件事</text>

    <text x="480" y="454" fill="#57534e" font-size="12">差价不是已经含在总价里</text>

    <!-- right -->
    <rect x="656" y="244" width="40" height="22" rx="4" fill="#0f6e6b" fill-opacity="0.14"/>
    <text x="676" y="260" fill="#0f6e6b" font-size="12" font-weight="600">对</text>
    <text x="774" y="292" fill="#1c1917" font-size="15" font-weight="600">只算次优那一项</text>

    <rect x="664" y="312" width="220" height="112" rx="6" fill="#f7f3eb" stroke="#0f6e6b" stroke-opacity="0.28"/>
    <text x="774" y="338" fill="#0f6e6b" font-size="13" font-weight="600">选贵的那台，等于放弃</text>
    <text x="774" y="362" fill="#1c1917" font-size="13">「便宜那台，外加这 4000 元</text>
    <text x="774" y="386" fill="#1c1917" font-size="13">能做成的最好那件事」</text>
    <text x="774" y="410" fill="#57534e" font-size="12">把那件好事写出来再比</text>

    <text x="774" y="454" fill="#0f6e6b" font-size="12" font-weight="600">只跟这一项比</text>
  </g>

  <line x1="48" y1="508" x2="912" y2="508" stroke="#1c1917" stroke-opacity="0.10"/>
  <text x="48" y="536" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">写出来会更常选便宜的，但不等于永远选更便宜的。若那件事仍不如升级，就该买贵的。</text>
</svg>
