<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="batna-zopa-title batna-zopa-desc">
  <title id="batna-zopa-title">可成交区间：房东与租客的保留点</title>
  <desc id="batna-zopa-desc">续租示例。房东保留点约 5075，租客保留点约 5633，中间是可成交区间；5800 报价落在区间外。</desc>
  <defs><pattern id="batna-zopa-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.09"/></pattern></defs>
  <rect width="960" height="540" fill="#f7f3eb"/><rect width="960" height="540" fill="url(#batna-zopa-dots)" opacity="0.45"/>
  <text x="48" y="44" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">续租示例：把 BATNA 折成保留点，看可成交区间（示意）</text>

  <!-- axis -->
  <line x1="100" y1="270" x2="860" y2="270" stroke="#1c1917" stroke-opacity="0.35" stroke-width="2"/>
  <!-- tick marks -->
  <g fill="#78716c" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <line x1="160" y1="262" x2="160" y2="278" stroke="#1c1917" stroke-opacity="0.25"/><text x="160" y="300">4800</text>
    <line x1="300" y1="262" x2="300" y2="278" stroke="#1c1917" stroke-opacity="0.25"/><text x="300" y="300">5200</text>
    <line x1="440" y1="262" x2="440" y2="278" stroke="#1c1917" stroke-opacity="0.25"/><text x="440" y="300">5600</text>
    <line x1="580" y1="262" x2="580" y2="278" stroke="#1c1917" stroke-opacity="0.25"/><text x="580" y="300">6000</text>
    <line x1="720" y1="262" x2="720" y2="278" stroke="#1c1917" stroke-opacity="0.25"/><text x="720" y="300">6400</text>
  </g>
  <text x="480" y="330" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">月租（元）</text>

  <!-- ZOPA band: 5075 to 5633. Map: 4800->160, 400 yuan = 140 px => px = 160 + (v-4800)*0.35 -->
  <!-- 5075 -> 160+(275)*0.35=256.25; 5633 -> 160+(833)*0.35=451.55; 5800 -> 160+1000*0.35=510 -->
  <rect x="256" y="248" width="196" height="44" rx="4" fill="#0f6e6b" fill-opacity="0.18" stroke="#0f6e6b" stroke-opacity="0.55"/>
  <text x="354" y="236" fill="#0f6e6b" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">可成交区间</text>

  <!-- landlord reservation -->
  <line x1="256" y1="200" x2="256" y2="292" stroke="#57534e" stroke-width="2"/>
  <circle cx="256" cy="270" r="6" fill="#57534e"/>
  <text x="256" y="176" fill="#57534e" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">房东保留点 ≈ 5075</text>
  <text x="256" y="196" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">换人不如续给你</text>

  <!-- tenant reservation -->
  <line x1="452" y1="200" x2="452" y2="292" stroke="#0f6e6b" stroke-width="2"/>
  <circle cx="452" cy="270" r="6" fill="#0f6e6b"/>
  <text x="452" y="176" fill="#0f6e6b" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">你的保留点 ≈ 5633</text>
  <text x="452" y="196" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">来自看过的替代房</text>

  <!-- offer 5800 outside -->
  <line x1="510" y1="318" x2="510" y2="360" stroke="#b45309" stroke-width="2"/>
  <circle cx="510" cy="270" r="7" fill="#b45309"/>
  <text x="510" y="384" fill="#b45309" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">房东报价 5800</text>
  <text x="510" y="404" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">落在区间外，多半是试探</text>

  <!-- side note -->
  <rect x="640" y="100" width="280" height="120" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-opacity="0.15"/>
  <text x="660" y="130" fill="#1c1917" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">怎么读这张图</text>
  <text x="660" y="156" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">重叠越大越好谈</text>
  <text x="660" y="178" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">没有重叠就谈不成</text>
  <text x="660" y="200" fill="#0f6e6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">保留点来自真会走的退路</text>

  <line x1="40" y1="458" x2="920" y2="458" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>
  <text x="40" y="490" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">数字来自课文假设算例（替代房 5300 + 搬家摊销）</text>
  <text x="920" y="490" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">示意 · 非某次真实议价</text>
</svg>
