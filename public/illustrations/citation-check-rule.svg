<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cc-rule-title cc-rule-desc">
  <title id="cc-rule-title">看起来完整，也不等于已经核对过</title>
  <desc id="cc-rule-desc">Walters 和 Wilder 2023 年在《Scientific Reports》里，让当时的 ChatGPT-3.5 和 ChatGPT-4 各写 42 篇短文献综述，一共 84 篇、636 条引用，再到多个数据库和网页里查这些文献是否存在。在该研究条件下，GPT-3.5 的 222 条引用里有 55% 是编造的；GPT-4 的 414 条里有 18% 是编造的。就算是查得到的真文献（GPT-3.5 有 101 条，GPT-4 有 340 条），仍分别有 43% 和 24% 存在实质性著录错误，比如作者、题名、年份或页码不对。这些比例只描述 2023 年那批模型和那组题目，不能当成今天所有工具的精确出错率。本图重绘自原文表 3、表 4，不是原表格的截图。</desc>
  <defs>
    <pattern id="cc-rule-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f7f3eb"/>
  <rect width="100%" height="100%" fill="url(#cc-rule-dots)" opacity="0.42"/>

  <g font-family="'Geist', 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600">看起来完整，也不等于已经核对过</text>
    <text x="48" y="62" fill="#57534e" font-size="12">Walters 和 Wilder 2023 · 42 个题目、84 篇短综述、636 条引用；只描述当年那批模型和题目</text>

    <!-- Left panel: fabrication -->
    <rect x="48" y="84" width="420" height="396" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="112" fill="#1c1917" font-size="14" font-weight="600">编造的引用，占全部引用的比例</text>
    <text x="68" y="132" fill="#57534e" font-size="12">原文表 3。分母是该模型写出的全部引用。</text>

    <!-- y axis 0-100, plot area: x 108-200 / 248-340? Better two bars centered -->
    <!-- Plot box: left 88, bottom 420, top 168, height 252 for 100% -->
    <!-- 252 px = 100%, so 1% = 2.52 px -->
    <line x1="96" y1="168" x2="96" y2="420" stroke="#1c1917" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="96" y1="420" x2="444" y2="420" stroke="#1c1917" stroke-opacity="0.28" stroke-width="1"/>
    <!-- grid lines at 25/50/75/100, labels to the left of axis, not on bars -->
    <line x1="96" y1="168" x2="444" y2="168" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="96" y1="231" x2="444" y2="231" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="96" y1="294" x2="444" y2="294" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="96" y1="357" x2="444" y2="357" stroke="#1c1917" stroke-opacity="0.08"/>
    <text x="88" y="172" fill="#78716c" font-size="11" text-anchor="end">100%</text>
    <text x="88" y="235" fill="#78716c" font-size="11" text-anchor="end">75%</text>
    <text x="88" y="298" fill="#78716c" font-size="11" text-anchor="end">50%</text>
    <text x="88" y="361" fill="#78716c" font-size="11" text-anchor="end">25%</text>
    <text x="88" y="424" fill="#78716c" font-size="11" text-anchor="end">0</text>

    <!-- GPT-3.5 55%: height = 55*2.52 = 138.6, y = 420-138.6 = 281.4 -->
    <!-- bars: width 72, GPT-3.5 x=168, GPT-4 x=304 -->
    <rect x="168" y="281.4" width="72" height="138.6" fill="#0f6e6b"/>
    <text x="204" y="270" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle">55%</text>
    <text x="204" y="442" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">GPT-3.5</text>
    <text x="204" y="460" fill="#57534e" font-size="11" text-anchor="middle">222 条引用</text>

    <!-- GPT-4 18%: height = 18*2.52 = 45.36, y = 420-45.36 = 374.64 -->
    <rect x="304" y="374.64" width="72" height="45.36" fill="#0f6e6b" fill-opacity="0.45"/>
    <text x="340" y="363" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle">18%</text>
    <text x="340" y="442" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">GPT-4</text>
    <text x="340" y="460" fill="#57534e" font-size="11" text-anchor="middle">414 条引用</text>

    <!-- Right panel: substantive errors among real -->
    <rect x="492" y="84" width="420" height="396" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="512" y="112" fill="#1c1917" font-size="14" font-weight="600">真文献中，仍有实质性著录错误的比例</text>
    <text x="512" y="132" fill="#57534e" font-size="12">原文表 4。分母只包括查得到的真文献。</text>

    <line x1="540" y1="168" x2="540" y2="420" stroke="#1c1917" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="540" y1="420" x2="888" y2="420" stroke="#1c1917" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="540" y1="168" x2="888" y2="168" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="540" y1="231" x2="888" y2="231" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="540" y1="294" x2="888" y2="294" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="540" y1="357" x2="888" y2="357" stroke="#1c1917" stroke-opacity="0.08"/>
    <text x="532" y="172" fill="#78716c" font-size="11" text-anchor="end">100%</text>
    <text x="532" y="235" fill="#78716c" font-size="11" text-anchor="end">75%</text>
    <text x="532" y="298" fill="#78716c" font-size="11" text-anchor="end">50%</text>
    <text x="532" y="361" fill="#78716c" font-size="11" text-anchor="end">25%</text>
    <text x="532" y="424" fill="#78716c" font-size="11" text-anchor="end">0</text>

    <!-- GPT-3.5 43%: height = 43*2.52 = 108.36, y = 420-108.36 = 311.64 -->
    <rect x="612" y="311.64" width="72" height="108.36" fill="#1c1917" fill-opacity="0.78"/>
    <text x="648" y="300" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle">43%</text>
    <text x="648" y="442" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">GPT-3.5</text>
    <text x="648" y="460" fill="#57534e" font-size="11" text-anchor="middle">101 条真文献</text>

    <!-- GPT-4 24%: height = 24*2.52 = 60.48, y = 420-60.48 = 359.52 -->
    <rect x="748" y="359.52" width="72" height="60.48" fill="#1c1917" fill-opacity="0.38"/>
    <text x="784" y="348" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle">24%</text>
    <text x="784" y="442" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">GPT-4</text>
    <text x="784" y="460" fill="#57534e" font-size="11" text-anchor="middle">340 条真文献</text>

    <rect x="48" y="500" width="864" height="108" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="528" fill="#1c1917" font-size="14" font-weight="600">文献查得到，也不等于著录或转述就是对的</text>
    <text x="68" y="552" fill="#57534e" font-size="13">实质性错误包括作者、题名、年份、期刊或页码不对。这些比例只描述 2023 年那批模型和那组题目，</text>
    <text x="68" y="572" fill="#57534e" font-size="13">不能当成今天所有工具的精确出错率。要留下的方法是：看起来完整，不等于已经核对过。</text>
    <text x="68" y="592" fill="#78716c" font-size="12">来源：Walters, Wilder（2023），Scientific Reports，表 3、表 4。DOI: 10.1038/s41598-023-41032-5</text>
  </g>
</svg>
