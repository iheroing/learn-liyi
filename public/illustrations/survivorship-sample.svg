<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sv-sample-title sv-sample-desc">
  <title id="sv-sample-title">你看到的样本 vs 同一批人的全貌</title>
  <desc id="sv-sample-desc">左侧是群聊、排行榜里留下的 6 个成功故事；右侧是同期 30 人，其中 24 人已退群、关停或沉默，以灰色虚线表示。</desc>
  <defs><pattern id="P" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/></pattern></defs>
  <rect width="960" height="460" fill="#f7f3eb"/><rect width="960" height="460" fill="url(#P)" opacity="0.42"/>
  <text x="48" y="48" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">成功率要用分母算，不是用晒出来的人数</text>
  <rect x="48" y="80" width="330" height="330" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/>
  <rect x="410" y="80" width="502" height="330" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/>
