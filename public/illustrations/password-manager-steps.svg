<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pm-steps-title pm-steps-desc">
  <title id="pm-steps-title">不必今天清完所有账号。先把最危险的那截链打断。</title>
  <desc id="pm-steps-desc">今天按这五步做。第一步，选定一个管理器：自己长期用的设备，优先用系统或浏览器自带的；设备和浏览器不统一，再选能跨端同步的；先不要在公用电脑上开启保存密码。第二步，设一把只在这一处用的主密码，并打开两步验证；主密码要能记住，可用 4 到 7 个不相关的词组成长口令，写到一处只有你找得到的地方以备忘记。第三步，先改邮箱密码：用管理器生成一个又长、又乱、只用于这个邮箱的密码；邮箱是许多账号的重置入口，它先独立，后面的链才会断。第四步，再改银行、支付、网盘，以及能登录许多别的服务的账号；其余不必今天清完，下次登录时再换；若管理器提示出现在泄露名单里，提前换。第五步，确认管理器坏了或手机丢了时，你还能拿回这些密码：看官方恢复方式，或给这份密码库本身留一份不常连着的备份；主密码不要存在公用设备上，也不要粘到聊天里。</desc>
  <defs>
    <pattern id="pm-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#f7f3eb"/>
  <rect width="960" height="620" fill="url(#pm-steps-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不必今天清完所有账号。先把最危险的那截链打断。</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">今天按这五步做 · 先改能重置别人的账号</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="344" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="640" y="84" width="272" height="232" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>
    <rect x="48" y="340" width="420" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="492" y="340" width="420" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>

    <circle cx="76" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="372" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="668" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.16"/>
    <circle cx="76" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="520" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>

    <text x="76" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="372" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="668" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="76" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="520" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">5</text>

    <text x="104" y="121" fill="#1c1917" font-size="14" font-weight="600">选定一个管理器</text>
    <text x="68" y="168" fill="#57534e" font-size="13">自己长期用的设备，</text>
    <text x="68" y="190" fill="#57534e" font-size="13">优先用系统或浏览器自带的。</text>
    <text x="68" y="222" fill="#78716c" font-size="12">设备和浏览器不统一，</text>
    <text x="68" y="242" fill="#78716c" font-size="12">再选能跨端同步的。</text>
    <text x="68" y="262" fill="#78716c" font-size="12">先不要在公用电脑上保存密码。</text>

    <text x="400" y="121" fill="#1c1917" font-size="14" font-weight="600">设主密码并打开两步验证</text>
    <text x="364" y="168" fill="#57534e" font-size="13">主密码只在这一处用，</text>
    <text x="364" y="190" fill="#57534e" font-size="13">要让了解你的人也很难猜中。</text>
    <text x="364" y="222" fill="#78716c" font-size="12">可用 4 到 7 个不相关的词</text>
    <text x="364" y="242" fill="#78716c" font-size="12">组成一句长口令，并写到</text>
    <text x="364" y="262" fill="#78716c" font-size="12">只有你找得到的地方备用。</text>

    <text x="696" y="121" fill="#1c1917" font-size="14" font-weight="600">先改邮箱密码</text>
    <text x="660" y="168" fill="#57534e" font-size="13">用管理器生成又长又乱、</text>
    <text x="660" y="190" fill="#57534e" font-size="13">只用于这个邮箱的密码。</text>
    <text x="660" y="222" fill="#78716c" font-size="12">邮箱是许多账号的重置入口。</text>
    <text x="660" y="242" fill="#78716c" font-size="12">它先独立，后面的链才会断。</text>
    <text x="660" y="262" fill="#44403c" font-size="12">先改这里，不必今天清完全部。</text>

    <text x="104" y="377" fill="#1c1917" font-size="14" font-weight="600">再改银行、支付、网盘</text>
    <text x="68" y="424" fill="#57534e" font-size="13">以及能登录许多别的服务的账号。</text>
    <text x="68" y="446" fill="#57534e" font-size="13">其余账号不必今天清完。</text>
    <text x="68" y="478" fill="#78716c" font-size="12">下次登录时，若还在用旧的共用密码，</text>
    <text x="68" y="498" fill="#78716c" font-size="12">就地换成管理器生成的新密码。</text>
    <text x="68" y="518" fill="#78716c" font-size="12">若提示出现在泄露名单里，提前换。</text>

    <text x="548" y="377" fill="#1c1917" font-size="14" font-weight="600">确认还能拿回这些密码</text>
    <text x="512" y="424" fill="#57534e" font-size="13">管理器坏了或手机丢了时，</text>
    <text x="512" y="446" fill="#57534e" font-size="13">你还要能拿回这份密码库。</text>
    <text x="512" y="478" fill="#78716c" font-size="12">看官方恢复方式，或给它本身</text>
    <text x="512" y="498" fill="#78716c" font-size="12">留一份不常连着的备份。</text>
    <text x="512" y="518" fill="#78716c" font-size="12">主密码不要存公用设备，也不要粘到聊天里。</text>
  </g>
</svg>
