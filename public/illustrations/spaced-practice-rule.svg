    <rect x="48" y="576" width="864" height="176" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="604" fill="#1c1917" font-size="14" font-weight="600">可先对照，不必当成所有科目的精确课表</text>
    <text x="68" y="630" fill="#57534e" font-size="13">约一周后要用，间隔大约一两天到三天；约五周后，大约一周到十天；</text>
    <text x="68" y="652" fill="#57534e" font-size="13">约十周后，大约两周；约一年后，大约三四周。先取一个你能执行的数。</text>
    <text x="68" y="682" fill="#1c1917" font-size="13">间隔过长，成绩会从峰顶再掉下来。不是越隔越久越好。</text>
    <text x="68" y="708" fill="#78716c" font-size="12">运动技能、需要理解的推导，间隔仍然常有帮助，但最优天数不必相同。到点已经完全忘光，说明间隔对你偏长，下次提前。</text>
    <text x="68" y="730" fill="#78716c" font-size="12">来源：Cepeda, Vul, Rohrer, Wixted, Pashler（2008），Psychological Science。</text>
