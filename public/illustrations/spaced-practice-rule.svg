    <text x="644" y="516" fill="#1c1917" font-size="12" font-weight="600">相对间隔 0 天，回忆提高 64%</text>
    <text x="644" y="536" fill="#57534e" font-size="11">效应量 d = 1.1。各测验时间的提高</text>
