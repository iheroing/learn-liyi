  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Cepeda 等人 2008 · 冷门知识、学到能背出、总共复习一次；只改间隔，学习次数相同</text>
