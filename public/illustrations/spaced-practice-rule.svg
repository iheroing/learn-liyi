<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sp-rule-title sp-rule-desc">
  <title id="sp-rule-title">间隔从 0 天加长时，成绩先升后降</title>
  <desc id="sp-rule-desc">Cepeda 等人 2008 年在《Psychological Science》里，1354 人先学会 32 条冷门知识，学到能正确回忆出来，隔开最多三个半月再复习一次，最后再隔最多大约一年做测验。在该研究条件下，对同一个测验时间，间隔从 0 天往上加，回忆成绩先升后降，不是越隔越久越好。他们实际用过的间隔里，回忆最好的是：测验在 7、35、70、350 天后，分别对应 1、11、21、21 天；插值大约是 3、8、12、27 天，约占等待时间的 43%、23%、17%、8%。和间隔为 0 天相比，较合适的间隔让最后的回忆成绩提高了 64%（d = 1.1）。这里只改间隔，学习次数相同。本图重绘自原文图 3a（回忆），曲线位置按原图读点，不是作者公开的原始数据表。这只描述该实验：冷门知识、学到能背出、总共复习一次，不是所有科目的精确课表。</desc>
  <defs>
    <pattern id="sp-rule-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
