<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="se-scene-title se-scene-desc">
  <title id="se-scene-title">随手试三道全对，说明不了新版更好</title>
  <desc id="se-scene-desc">假设的情况：让 AI 给题库里的题打知识点标签。左侧：改完提示词随手挑三道题试，三道都对，看着比以前好，就换上了。右侧：两周后有人反馈，资料分析里一整类增长率题，新版全分到了别的知识点。那三道没覆盖这类题，也没跟旧版在同一批题上比。缺的是一把固定的尺子：一组每次改动都拿来跑一遍的真实样例。</desc>
  <defs>
    <pattern id="se-scene-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#f7f3eb"/>
  <rect width="960" height="560" fill="url(#se-scene-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">随手试三道全对，说明不了新版更好</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">假设的情况 · 让 AI 给题库里的题打知识点标签</text>

  <!-- Left panel -->
  <rect x="48" y="84" width="420" height="356" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
  <text x="68" y="118" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">改完提示词，随手挑三道试</text>
  <text x="68" y="140" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">当天</text>
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="68" y="164" width="300" height="40" rx="5" fill="#0f6e6b" fill-opacity="0.10" stroke="#0f6e6b" stroke-opacity="0.35"/>
    <text x="84" y="189" fill="#0f6e6b" font-size="13" font-weight="600">题 1 · 标签正确</text>
    <path d="M392 176 l7 9 14 -16" fill="none" stroke="#0f6e6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="216" width="300" height="40" rx="5" fill="#0f6e6b" fill-opacity="0.10" stroke="#0f6e6b" stroke-opacity="0.35"/>
    <text x="84" y="241" fill="#0f6e6b" font-size="13" font-weight="600">题 2 · 标签正确</text>
    <path d="M392 228 l7 9 14 -16" fill="none" stroke="#0f6e6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="268" width="300" height="40" rx="5" fill="#0f6e6b" fill-opacity="0.10" stroke="#0f6e6b" stroke-opacity="0.35"/>
    <text x="84" y="293" fill="#0f6e6b" font-size="13" font-weight="600">题 3 · 标签正确</text>
    <path d="M392 280 l7 9 14 -16" fill="none" stroke="#0f6e6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="352" fill="#1c1917" font-size="14" font-weight="600">看着比以前好，就换上了</text>
    <text x="68" y="378" fill="#57534e" font-size="12">这三道是顺手挑的，</text>
    <text x="68" y="398" fill="#57534e" font-size="12">旧版也没在同样的题上跑过。</text>
  </g>

  <!-- Right panel -->
  <rect x="492" y="84" width="420" height="356" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
  <text x="512" y="118" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">两周后有人反馈</text>
  <text x="512" y="140" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">资料分析 · 增长率题，新版全分到了别的知识点</text>
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="512" y="164" width="300" height="40" rx="5" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.40"/>
    <text x="528" y="189" fill="#44403c" font-size="13" font-weight="600">增长率题 → 别的知识点</text>
    <path d="M840 176 l14 14 M854 176 l-14 14" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="512" y="216" width="300" height="40" rx="5" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.40"/>
    <text x="528" y="241" fill="#44403c" font-size="13" font-weight="600">增长率题 → 别的知识点</text>
    <path d="M840 228 l14 14 M854 228 l-14 14" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="512" y="268" width="300" height="40" rx="5" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.40"/>
    <text x="528" y="293" fill="#44403c" font-size="13" font-weight="600">增长率题 → 别的知识点</text>
    <path d="M840 280 l14 14 M854 280 l-14 14" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
    <text x="512" y="352" fill="#1c1917" font-size="14" font-weight="600">新版不一定更差，但当时没法知道</text>
    <text x="512" y="378" fill="#57534e" font-size="12">那三道没覆盖这类题，</text>
    <text x="512" y="398" fill="#57534e" font-size="12">也没跟旧版放在同一批题上比。</text>
  </g>

  <!-- Bottom ruler strip -->
  <rect x="48" y="460" width="864" height="68" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>
  <g stroke="#0f6e6b" stroke-opacity="0.55" stroke-width="1.4">
    <path d="M72 476 V512"/><path d="M84 494 V512"/><path d="M96 486 V512"/><path d="M108 494 V512"/><path d="M120 476 V512"/>
  </g>
  <text x="148" y="491" fill="#0f6e6b" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">缺的是一把固定的尺子</text>
  <text x="148" y="513" fill="#44403c" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">一组每次改动都拿来跑一遍的真实样例，AI 工程里叫 evals（评测）</text>
</svg>
