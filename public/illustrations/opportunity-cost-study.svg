<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oc-study-title oc-study-desc">
  <title id="oc-study-title">Frederick 等（2009）：点名机会成本后的选择变化</title>
  <desc id="oc-study-desc">三项实验重绘。DVD 想买比例：只写「不买」75%，写成「把 14.99 美元留着买别的」55%。已决定购买的人里，选更便宜 16GB iPod：37% 升到 73%。用刚发的钱买真杯子，选更便宜那只：40% 升到 60%。均为该实验条件下的选择变化。</desc>
  <defs>
    <pattern id="oc-study-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="580" fill="#f7f3eb"/>
  <rect width="960" height="580" fill="url(#oc-study-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">把「放弃了什么」写到台面上，选择就会变</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Frederick、Novemsky 等（2009）三项实验 · 按课文数据重绘</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#57534e">
    <rect x="668" y="46" width="14" height="14" fill="#57534e" fill-opacity="0.40"/>
    <text x="688" y="58">未点名机会成本</text>
    <rect x="812" y="46" width="14" height="14" fill="#0f6e6b" fill-opacity="0.80"/>
    <text x="832" y="58">写成「留下这笔钱」</text>
  </g>

  <rect x="48" y="84" width="276" height="416" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
  <rect x="342" y="84" width="276" height="416" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
  <rect x="636" y="84" width="276" height="416" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>

  <!-- Panel geometry: axis x = panel+44, right = panel+260, bars 52 wide, centers 120 apart.
       bar1_x = panel+64, bar2_x = panel+184, centers panel+90 and panel+210. -->

  <!-- ===== Panel 1: DVD 75 vs 55 ===== -->
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="68" y="114" fill="#1c1917" font-size="15" font-weight="600">DVD（14.99 美元）</text>
    <text x="68" y="136" fill="#57534e" font-size="12">想买的比例</text>

    <line x1="92" y1="400" x2="304" y2="400" stroke="#1c1917" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="92" y1="300" x2="304" y2="300" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="92" y1="200" x2="304" y2="200" stroke="#1c1917" stroke-opacity="0.08"/>
    <g fill="#78716c" font-size="11" text-anchor="end">
      <text x="84" y="404">0</text>
      <text x="84" y="304">50</text>
      <text x="84" y="204">100</text>
    </g>
    <text x="84" y="186" fill="#78716c" font-size="10" text-anchor="end">%</text>

    <rect x="112" y="250" width="52" height="150" fill="#57534e" fill-opacity="0.40"/>
    <rect x="232" y="290" width="52" height="110" fill="#0f6e6b" fill-opacity="0.80"/>
    <text x="138" y="238" fill="#1c1917" font-size="15" font-weight="600" text-anchor="middle">75%</text>
    <text x="258" y="278" fill="#0f6e6b" font-size="15" font-weight="600" text-anchor="middle">55%</text>

    <text x="138" y="424" fill="#57534e" font-size="12" text-anchor="middle">只写「不买」</text>
    <text x="258" y="424" fill="#1c1917" font-size="12" text-anchor="middle">写成</text>
    <text x="258" y="442" fill="#1c1917" font-size="12" text-anchor="middle">「留着买别的」</text>

    <text x="186" y="474" fill="#0f6e6b" font-size="13" font-weight="600" text-anchor="middle">75% → 55%</text>
  </g>

  <!-- ===== Panel 2: iPod 37 vs 73 ===== -->
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="362" y="114" fill="#1c1917" font-size="15" font-weight="600">iPod（16GB / 32GB）</text>
    <text x="362" y="136" fill="#57534e" font-size="12">已决定购买的人里，选便宜那款</text>

    <line x1="386" y1="400" x2="598" y2="400" stroke="#1c1917" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="386" y1="300" x2="598" y2="300" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="386" y1="200" x2="598" y2="200" stroke="#1c1917" stroke-opacity="0.08"/>
    <g fill="#78716c" font-size="11" text-anchor="end">
      <text x="378" y="404">0</text>
      <text x="378" y="304">50</text>
      <text x="378" y="204">100</text>
    </g>
    <text x="378" y="186" fill="#78716c" font-size="10" text-anchor="end">%</text>

    <rect x="406" y="326" width="52" height="74" fill="#57534e" fill-opacity="0.40"/>
    <rect x="526" y="254" width="52" height="146" fill="#0f6e6b" fill-opacity="0.80"/>
    <text x="432" y="314" fill="#1c1917" font-size="15" font-weight="600" text-anchor="middle">37%</text>
    <text x="552" y="242" fill="#0f6e6b" font-size="15" font-weight="600" text-anchor="middle">73%</text>

    <text x="432" y="424" fill="#57534e" font-size="12" text-anchor="middle">只写差价</text>
    <text x="432" y="442" fill="#57534e" font-size="12" text-anchor="middle">100 美元</text>
    <text x="552" y="424" fill="#1c1917" font-size="12" text-anchor="middle">「留给你</text>
    <text x="552" y="442" fill="#1c1917" font-size="12" text-anchor="middle">100 美元现金」</text>

    <text x="480" y="474" fill="#0f6e6b" font-size="13" font-weight="600" text-anchor="middle">37% → 73%</text>
  </g>

  <!-- ===== Panel 3: mugs 40 vs 60 ===== -->
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="656" y="114" fill="#1c1917" font-size="15" font-weight="600">真钱买杯子</text>
    <text x="656" y="136" fill="#57534e" font-size="12">用刚发的钱，选更便宜那只</text>

    <line x1="680" y1="400" x2="892" y2="400" stroke="#1c1917" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="680" y1="300" x2="892" y2="300" stroke="#1c1917" stroke-opacity="0.08"/>
    <line x1="680" y1="200" x2="892" y2="200" stroke="#1c1917" stroke-opacity="0.08"/>
    <g fill="#78716c" font-size="11" text-anchor="end">
      <text x="672" y="404">0</text>
      <text x="672" y="304">50</text>
      <text x="672" y="204">100</text>
    </g>
    <text x="672" y="186" fill="#78716c" font-size="10" text-anchor="end">%</text>

    <rect x="700" y="320" width="52" height="80" fill="#57534e" fill-opacity="0.40"/>
    <rect x="820" y="280" width="52" height="120" fill="#0f6e6b" fill-opacity="0.80"/>
    <text x="726" y="308" fill="#1c1917" font-size="15" font-weight="600" text-anchor="middle">40%</text>
    <text x="846" y="268" fill="#0f6e6b" font-size="15" font-weight="600" text-anchor="middle">60%</text>

    <text x="726" y="424" fill="#57534e" font-size="12" text-anchor="middle">未点名</text>
    <text x="726" y="442" fill="#57534e" font-size="12" text-anchor="middle">留下差价</text>
    <text x="846" y="424" fill="#1c1917" font-size="12" text-anchor="middle">「留给你</text>
    <text x="846" y="442" fill="#1c1917" font-size="12" text-anchor="middle">一笔现金」</text>

    <text x="774" y="474" fill="#0f6e6b" font-size="13" font-weight="600" text-anchor="middle">40% → 60%</text>
  </g>

  <line x1="48" y1="524" x2="912" y2="524" stroke="#1c1917" stroke-opacity="0.10"/>
  <text x="48" y="550" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">以上为该实验条件下的选择变化，不是个人的精确阈值</text>
  <text x="912" y="550" fill="#78716c" font-size="11" text-anchor="end" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Frederick, Novemsky, Wang, Dhar &amp; Nowlis（2009），JCR 36(4)</text>
</svg>
