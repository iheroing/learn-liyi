<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ca-steps-title ca-steps-desc">
  <title id="ca-steps-title">今天按这五步看，谁该留下、把什么交出去</title>
  <desc id="ca-steps-desc">第一步，写下两件正在抢同一段时间的事，以及谁还可以接手；只写正在抢时间的那两件，不要列愿望清单；接手的人可以是同事、家人，也可以是准备购买的服务。第二步，对每个能做的人，写一句：他做这件事，要放弃什么；空格里填他真心会去做的次优项，不要只写「节约时间」。第三步，比谁放弃得更少；放弃更少的人，在这件事上有比较优势；你更快，并不自动等于你放弃得更少。第四步，把你放弃得更多的事交出去：请人、购买、互换，或这轮先不做；自己留下机会成本更低的那一件。第五步，估一下交接成本；说明、对齐标准、返工如果明显超过省下的时间，就维持现状，只挪出交接最便宜的那一件。</desc>
  <defs>
    <pattern id="ca-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#f7f3eb"/>
  <rect width="960" height="620" fill="url(#ca-steps-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">今天按这五步看，谁该留下、把什么交出去</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先比谁放弃得更少，再估交接成本</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="344" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="640" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="48" y="340" width="420" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="492" y="340" width="420" height="232" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="76" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="372" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="668" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="76" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="520" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.16"/>

    <text x="76" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="372" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="668" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="76" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="520" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">5</text>

    <text x="104" y="121" fill="#1c1917" font-size="14" font-weight="600">写下两件正在抢时间的事</text>
    <text x="68" y="168" fill="#57534e" font-size="13">以及谁还可以接手。</text>
    <text x="68" y="190" fill="#57534e" font-size="13">只写正在抢时间的那两件，</text>
    <text x="68" y="212" fill="#57534e" font-size="13">不要列愿望清单。</text>
    <text x="68" y="244" fill="#78716c" font-size="12">接手的人可以是同事、家人，</text>
    <text x="68" y="264" fill="#78716c" font-size="12">也可以是准备购买的服务。</text>

    <text x="400" y="121" fill="#1c1917" font-size="14" font-weight="600">写清各自要放弃什么</text>
    <text x="364" y="168" fill="#57534e" font-size="13">对每个能做的人写一句：</text>
    <text x="364" y="190" fill="#57534e" font-size="13">他做这件事，要放弃什么。</text>
    <text x="364" y="222" fill="#78716c" font-size="12">填他真心会去做的次优项，</text>
    <text x="364" y="244" fill="#78716c" font-size="12">不要只写「节约时间」。</text>
    <text x="364" y="266" fill="#78716c" font-size="12">这就是机会成本。</text>

    <text x="696" y="121" fill="#1c1917" font-size="14" font-weight="600">比谁放弃得更少</text>
    <text x="660" y="168" fill="#57534e" font-size="13">放弃更少的人，</text>
    <text x="660" y="190" fill="#57534e" font-size="13">在这件事上有比较优势。</text>
    <text x="660" y="222" fill="#78716c" font-size="12">你更快，并不自动等于</text>
    <text x="660" y="244" fill="#78716c" font-size="12">你放弃得更少。</text>

    <text x="104" y="377" fill="#1c1917" font-size="14" font-weight="600">把你放弃得更多的事交出去</text>
    <text x="68" y="424" fill="#57534e" font-size="13">请人、购买、互换，</text>
    <text x="68" y="446" fill="#57534e" font-size="13">或这轮先不做。</text>
    <text x="68" y="478" fill="#78716c" font-size="12">自己留下机会成本更低、</text>
    <text x="68" y="500" fill="#78716c" font-size="12">也就是你放弃得更少的那一件。</text>

    <text x="548" y="377" fill="#1c1917" font-size="14" font-weight="600">估一下交接成本</text>
    <text x="512" y="424" fill="#57534e" font-size="13">说明、对齐标准、返工如果明显</text>
    <text x="512" y="446" fill="#57534e" font-size="13">超过省下的时间，就维持现状，</text>
    <text x="512" y="468" fill="#57534e" font-size="13">只挪出交接最便宜的那一件。</text>
    <text x="512" y="500" fill="#78716c" font-size="12">质量差很多、要大量返工时，</text>
    <text x="512" y="520" fill="#78716c" font-size="12">就还不是同一件事，先别比时间。</text>
  </g>
</svg>
