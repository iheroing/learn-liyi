<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ret-lit-title ret-lit-desc">
  <title id="ret-lit-title">测试效应示意：即时与延后 × 再学与测验</title>
  <desc id="ret-lit-desc">分组柱状图。横轴为测验时机（即时约五分钟、延后约一周），每组两根柱分别表示再学与先测。即时再学更高；延后先测更高。示意 Roediger &amp; Karpicke 类发现方向，非精确百分比。</desc>
  <defs>
    <pattern id="ret-lit-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#f7f3eb"/>
  <rect width="960" height="540" fill="url(#ret-lit-dots)" opacity="0.45"/>

  <g stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.08">
    <line x1="140" y1="331" x2="860" y2="331"/>
    <line x1="140" y1="262" x2="860" y2="262"/>
    <line x1="140" y1="194" x2="860" y2="194"/>
    <line x1="140" y1="125" x2="860" y2="125"/>
    <line x1="140" y1="56" x2="860" y2="56"/>
  </g>
  <line x1="140" y1="56" x2="140" y2="400" stroke="#1c1917" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="140" y1="400" x2="860" y2="400" stroke="#1c1917" stroke-width="1" stroke-opacity="0.28"/>

  <g fill="#57534e" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">
    <text x="132" y="404">0</text>
    <text x="132" y="335">20</text>
    <text x="132" y="266">40</text>
    <text x="132" y="198">60</text>
    <text x="132" y="129">80</text>
    <text x="132" y="60">100</text>
  </g>

  <!-- y = 400 - v*3.44
       Immediate restudy 81 → y=121.4; test 75 → y=142
       Delayed restudy 42 → y=255.5; test 68 → y=166.1
       Group centers: immediate 340, delayed 660
       bar w=44, gap=16
  -->
  <!-- Immediate -->
  <rect x="274" y="121" width="44" height="279" fill="#1c1917" fill-opacity="0.55" stroke="#1c1917" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="334" y="142" width="44" height="258" fill="#9a3412" stroke="#9a3412" stroke-width="1"/>
  <!-- Delayed -->
  <rect x="594" y="256" width="44" height="144" fill="#1c1917" fill-opacity="0.55" stroke="#1c1917" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="654" y="166" width="44" height="234" fill="#9a3412" stroke="#9a3412" stroke-width="1"/>

  <!-- Endpoint values above bars in empty space (not on bars) -->
  <g fill="#57534e" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">
    <text x="296" y="112">81</text>
    <text x="356" y="133">75</text>
    <text x="616" y="247">42</text>
    <text x="676" y="157">68</text>
  </g>

  <g fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="326" y="424">即时（约五分钟）</text>
    <text x="646" y="424">延后（约一周）</text>
  </g>

  <text x="500" y="448" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">最终测验时机</text>
  <text transform="rotate(-90 36 228)" x="36" y="228" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">相对正确回忆（示意）</text>

  <line x1="40" y1="472" x2="920" y2="472" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>
  <text x="40" y="496" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>
  <rect x="96" y="484" width="16" height="12" fill="#1c1917" fill-opacity="0.55" stroke="#1c1917" stroke-width="1" stroke-opacity="0.7"/>
  <text x="118" y="496" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">再学（restudy）</text>
  <rect x="268" y="484" width="16" height="12" fill="#9a3412" stroke="#9a3412" stroke-width="1"/>
  <text x="290" y="496" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先测（retrieval）</text>
  <text x="920" y="496" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">示意方向 · 非原文精确百分比</text>
</svg>
