<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sp-steps-title sp-steps-desc">
  <title id="sp-steps-title">今天按这五步改复习安排</title>
  <desc id="sp-steps-desc">第一步，写下材料，以及你真正要用它的日期；考试、汇报、动手做都可以，先算出大约还有多久，不要只写「有空再看」。第二步，看第二遍现在排在哪一天；如果还排在同一天，把它挪走，总时间可以不变，改的是间隔。第三步，按「要用的那天」粗选一个间隔：约一周后，大约一两天到三天；约五周后，大约一周到十天；约十周后，大约两周；约一年后，大约三四周。第四步，到点先自己提，再核对；合上材料，试着写出步骤、定义或操作，再对照，不要再看一遍就放过。第五步，用完一次就微调；到点几乎想不起来，下次缩短间隔；提得很顺、几乎不用想，可以略延长。若还要第三次，插在第二次和要用的那天之间，不要又堆回同一晚。</desc>
  <defs>
    <pattern id="sp-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f7f3eb"/>
  <rect width="100%" height="100%" fill="url(#sp-steps-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">今天按这五步改复习安排</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">大约 15 到 20 分钟。总时间可以不变，改的是间隔；到点先自己提再核对</text>

  <g font-family="'Geist', 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="344" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="640" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="48" y="340" width="420" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="492" y="340" width="420" height="232" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="76" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="372" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="668" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="76" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="520" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.16"/>

    <text x="76" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="372" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="668" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="76" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="520" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">5</text>

    <text x="104" y="121" fill="#1c1917" font-size="14" font-weight="600">写下材料和要用的日期</text>
    <text x="68" y="168" fill="#57534e" font-size="13">考试、汇报、动手做都可以。</text>
    <text x="68" y="190" fill="#57534e" font-size="13">先算出大约还有多久。</text>
    <text x="68" y="222" fill="#78716c" font-size="12">不要只写「有空再看」。</text>

    <text x="400" y="121" fill="#1c1917" font-size="14" font-weight="600">看第二遍排在哪一天</text>
    <text x="364" y="168" fill="#57534e" font-size="13">如果还排在同一天，</text>
    <text x="364" y="190" fill="#57534e" font-size="13">把它挪走。</text>
    <text x="364" y="222" fill="#78716c" font-size="12">总时间可以不变，</text>
    <text x="364" y="244" fill="#78716c" font-size="12">改的是间隔。</text>

    <text x="696" y="121" fill="#1c1917" font-size="14" font-weight="600">按要用的那天粗选间隔</text>
    <text x="660" y="168" fill="#57534e" font-size="13">约一周后：一两天到三天；</text>
    <text x="660" y="190" fill="#57534e" font-size="13">约五周后：一周到十天；</text>
    <text x="660" y="212" fill="#57534e" font-size="13">约十周后：大约两周；</text>
    <text x="660" y="234" fill="#57534e" font-size="13">约一年后：大约三四周。</text>
    <text x="660" y="266" fill="#78716c" font-size="12">先取一个你能执行的数。</text>

    <text x="104" y="377" fill="#1c1917" font-size="14" font-weight="600">到点先自己提，再核对</text>
    <text x="68" y="424" fill="#57534e" font-size="13">合上材料，试着写出步骤、</text>
    <text x="68" y="446" fill="#57534e" font-size="13">定义或操作，再对照。</text>
    <text x="68" y="478" fill="#78716c" font-size="12">不要再看一遍就放过。</text>
    <text x="68" y="500" fill="#78716c" font-size="12">这是第 2 期的做法，装进今天的间隔里。</text>

    <text x="548" y="377" fill="#1c1917" font-size="14" font-weight="600">用完一次就微调</text>
    <text x="512" y="424" fill="#57534e" font-size="13">到点几乎想不起来，下次缩短间隔；</text>
    <text x="512" y="446" fill="#57534e" font-size="13">提得很顺、几乎不用想，可以略延长。</text>
    <text x="512" y="468" fill="#57534e" font-size="13">若还要第三次，插在第二次和</text>
    <text x="512" y="490" fill="#57534e" font-size="13">要用的那天之间。</text>
    <text x="512" y="522" fill="#78716c" font-size="12">不要又堆回同一晚。</text>
  </g>
</svg>
