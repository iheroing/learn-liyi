<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="br-rule-title br-rule-desc">
  <title id="br-rule-title">先问原来有多常见，再看这条线索有多硬</title>
  <desc id="br-rule-desc">把 1000 人摊开，并假定灵敏度近似 100%。1000 人里，按 1/1000 的出现率，大约 1 人真有这种病，这 1 人会呈阳性。假阳性率 5%，意思是剩下大约 999 个没有病的人里，也会有大约 50 人呈阳性（0.05 × 999 ≈ 50）。呈阳性的一共大约 51 人，其中真有病的只有 1 人，大约是 2%，不是 95%。5% 听起来不大。可这件事一旦很少见，这 5% 就会落在一大群「没有这回事」的人身上，假阳性会比真阳性多得多。</desc>
  <defs>
    <pattern id="br-rule-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="680" fill="#f7f3eb"/>
  <rect width="960" height="680" fill="url(#br-rule-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先问原来有多常见，再看这条线索有多硬</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">把 1000 人摊开（灵敏度近似 100%）</text>

