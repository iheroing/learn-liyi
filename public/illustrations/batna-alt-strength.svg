<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="batna-lit-title batna-lit-desc">
  <title id="batna-lit-title">替代方案好坏与谈判结果（文献向示意）</title>
  <desc id="batna-lit-desc">示意方向：手里有更好退路的一方，谈成的条件通常更好。非 Pinkley 等（1994）原文精确数据。</desc>
  <defs><pattern id="batna-lit-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.09"/></pattern></defs>
  <rect width="960" height="540" fill="#f7f3eb"/><rect width="960" height="540" fill="url(#batna-lit-dots)" opacity="0.45"/>
  <text x="48" y="44" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">手里退路越好，谈成的条件通常越好（文献向示意）</text>

  <!-- axes -->
  <line x1="120" y1="420" x2="620" y2="420" stroke="#1c1917" stroke-opacity="0.2"/>
  <text x="100" y="424" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">低</text>
  <line x1="120" y1="300" x2="620" y2="300" stroke="#1c1917" stroke-opacity="0.06"/>
  <line x1="120" y1="180" x2="620" y2="180" stroke="#1c1917" stroke-opacity="0.06"/>
  <text x="100" y="184" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">高</text>
  <text transform="translate(64 300) rotate(-90)" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">谈成条件（示意）</text>

  <!-- bars: no alt / weak / strong -->
  <rect x="180" y="300" width="90" height="120" fill="#57534e" fill-opacity="0.35"/>
  <text x="225" y="292" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">偏低</text>
  <text x="225" y="444" fill="#1c1917" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">没有退路</text>

  <rect x="340" y="240" width="90" height="180" fill="#57534e" fill-opacity="0.55"/>
  <text x="385" y="232" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">中等</text>
  <text x="385" y="444" fill="#1c1917" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">弱替代</text>

  <rect x="500" y="160" width="90" height="260" fill="#0f6e6b" fill-opacity="0.65"/>
  <text x="545" y="152" fill="#0f6e6b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">更好</text>
  <text x="545" y="444" fill="#0f6e6b" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">强替代</text>

  <rect x="680" y="120" width="240" height="260" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-opacity="0.15"/>
  <text x="700" y="152" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">实验里常见的方向</text>
  <text x="700" y="184" fill="#57534e" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">有无替代、替代好坏，</text>
  <text x="700" y="208" fill="#57534e" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">都会推谈判结果。</text>
  <text x="700" y="244" fill="#0f6e6b" font-size="13" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">谈判力主要来自退路，</text>
  <text x="700" y="268" fill="#0f6e6b" font-size="13" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不主要来自口才。</text>
  <text x="700" y="304" fill="#78716c" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">柱高只表示方向，</text>
  <text x="700" y="326" fill="#78716c" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不是原文精确分数。</text>

  <line x1="40" y1="478" x2="920" y2="478" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>
  <text x="40" y="506" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">思路参考 Pinkley, Neale &amp; Bennett（1994）等关于替代方案的实验</text>
  <text x="920" y="506" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">文献向示意 · 非精确复现</text>
</svg>
