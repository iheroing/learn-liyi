<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sv-steps-title sv-steps-desc">
  <title id="sv-steps-title">防幸存者偏差的六步</title>
  <desc id="sv-steps-desc">六步：写清样本、失败去哪了、找分母、找不到就降把握、单列看不见的风险、与回归均值分开。</desc>
  <defs><pattern id="P" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/></pattern></defs>
  <rect width="960" height="360" fill="#f7f3eb"/><rect width="960" height="360" fill="url(#P)" opacity="0.42"/>
  <text x="48" y="48" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先问失败的那些去哪了，再谈「这样做能成」</text>
  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="48" y="90" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="82" cy="138" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="82" y="143" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">1</text><text x="112" y="144" fill="#1c1917" font-size="16" font-weight="600">写清样本</text><path d="M318 138 H340 M334 132 L341 138 L334 144" fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/><rect x="348" y="90" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="382" cy="138" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="382" y="143" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">2</text><text x="412" y="144" fill="#1c1917" font-size="16" font-weight="600">失败去哪了</text><path d="M618 138 H640 M634 132 L641 138 L634 144" fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/><rect x="648" y="90" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="682" cy="138" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="682" y="143" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">3</text><text x="712" y="144" fill="#1c1917" font-size="16" font-weight="600">找分母</text><rect x="48" y="220" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="82" cy="268" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="82" y="273" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">4</text><text x="112" y="274" fill="#1c1917" font-size="16" font-weight="600">找不到就降把握</text><path d="M318 268 H340 M334 262 L341 268 L334 274" fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/><rect x="348" y="220" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="382" cy="268" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="382" y="273" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">5</text><text x="412" y="274" fill="#1c1917" font-size="16" font-weight="600">单列看不见的风险</text><path d="M618 268 H640 M634 262 L641 268 L634 274" fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round"/><rect x="648" y="220" width="264" height="96" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.18"/><circle cx="682" cy="268" r="16" fill="none" stroke="#0f6e6b" stroke-width="1.6"/><text x="682" y="273" fill="#0f6e6b" font-size="14" font-weight="600" text-anchor="middle">6</text><text x="712" y="274" fill="#1c1917" font-size="16" font-weight="600">与回归均值分开</text><path d="M780 190 V200 H180 V214" fill="none" stroke="#0f6e6b" stroke-width="1.4" stroke-dasharray="4 4"/></g>
</svg>
