<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ivp-steps-title ivp-steps-desc">
  <title id="ivp-steps-title">卡住时按这六步走</title>
  <desc id="ivp-steps-desc">当面谈之前，先用 10 到 15 分钟写一遍；谈的过程中卡住了，也可以停下来按这个顺序问。第一步，把双方已经说出口的立场各写一行，先不要改，也不要先折中。第二步，在自己的立场下面写：我要这个，是为了保住什么、避免什么，至少写两条。第三步，用一句不带质问味道的话问对方同样的事，听完后用你的话复述一遍，让对方有机会纠正。第四步，把两边的利益并列看一遍，标出哪些其实不冲突，哪些才是真冲突。第五步，针对利益，先列出至少三个能同时照顾两边的办法，再挑，不要立刻在原来的两个条件之间取中。第六步，用退路做最后一道筛，比谈不成后你能做的最好那条路还差的，不选。</desc>
  <defs>
    <pattern id="ivp-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#f7f3eb"/>
  <rect width="960" height="620" fill="url(#ivp-steps-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">卡住时按这六步走，当面谈之前先写 10 到 15 分钟</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">谈的过程中卡住了，也可以停下来按这个顺序问</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="344" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="640" y="84" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="48" y="340" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="344" y="340" width="272" height="232" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="640" y="340" width="272" height="232" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="76" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="372" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="668" cy="116" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="76" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="372" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.12"/>
    <circle cx="668" cy="372" r="16" fill="#0f6e6b" fill-opacity="0.16"/>

    <text x="76" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="372" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="668" y="121" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="76" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="372" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="668" y="377" fill="#0f6e6b" font-size="14" font-weight="700" text-anchor="middle">6</text>

    <text x="104" y="121" fill="#1c1917" font-size="14" font-weight="600">把双方的立场各写一行</text>
    <text x="68" y="168" fill="#57534e" font-size="13">已经说出口的条件，</text>
    <text x="68" y="190" fill="#57534e" font-size="13">先原样记下。</text>
    <text x="68" y="224" fill="#78716c" font-size="12">先不要改，</text>
    <text x="68" y="244" fill="#78716c" font-size="12">也不要先折中。</text>

    <text x="400" y="121" fill="#1c1917" font-size="14" font-weight="600">写下自己要这个的理由</text>
    <text x="364" y="168" fill="#57534e" font-size="13">我要这个，是为了保住什么、</text>
    <text x="364" y="190" fill="#57534e" font-size="13">避免什么。</text>
    <text x="364" y="224" fill="#78716c" font-size="12">至少写两条。</text>
    <text x="364" y="244" fill="#78716c" font-size="12">人往往不止一个利益。</text>

    <text x="696" y="121" fill="#1c1917" font-size="14" font-weight="600">用一句不带质问的话去问</text>
    <text x="660" y="168" fill="#57534e" font-size="13">「你坚持这个，主要是为了</text>
    <text x="660" y="190" fill="#57534e" font-size="13">解决什么问题？」</text>
    <text x="660" y="224" fill="#78716c" font-size="12">听完后用你的话复述一遍，</text>
    <text x="660" y="244" fill="#78716c" font-size="12">让对方有机会纠正。</text>

    <text x="104" y="377" fill="#1c1917" font-size="14" font-weight="600">把两边的利益并列看一遍</text>
    <text x="68" y="424" fill="#57534e" font-size="13">标出哪些其实不冲突，</text>
    <text x="68" y="446" fill="#57534e" font-size="13">哪些才是真冲突。</text>
    <text x="68" y="480" fill="#78716c" font-size="12">相容的先分出来，</text>
    <text x="68" y="500" fill="#78716c" font-size="12">真冲突再单独处理。</text>

    <text x="400" y="377" fill="#1c1917" font-size="14" font-weight="600">先列出至少三个办法，再挑</text>
    <text x="364" y="424" fill="#57534e" font-size="13">针对利益来想，</text>
    <text x="364" y="446" fill="#57534e" font-size="13">要能同时照顾两边。</text>
    <text x="364" y="480" fill="#78716c" font-size="12">不要立刻在原来的</text>
    <text x="364" y="500" fill="#78716c" font-size="12">两个条件之间取中。</text>

    <text x="696" y="377" fill="#1c1917" font-size="14" font-weight="600">用退路做最后一道筛</text>
    <text x="660" y="424" fill="#57534e" font-size="13">比谈不成后你能做的</text>
    <text x="660" y="446" fill="#57534e" font-size="13">最好那条路还差的，不选。</text>
    <text x="660" y="480" fill="#78716c" font-size="12">看清利益，也不等于</text>
    <text x="660" y="500" fill="#78716c" font-size="12">必须答应对方的立场。</text>
  </g>
</svg>
