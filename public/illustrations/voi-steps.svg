<svg viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voi-steps-title voi-steps-desc">
  <title id="voi-steps-title">做决定前先过这六步</title>
  <desc id="voi-steps-desc">六步：写下现在的决定、可能听到的结果、会改决定吗、改了能好多少（上限）、打听代价对比、不完美信息打折。</desc>
  <defs>
    <pattern id="voi-steps-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="390" fill="#f7f3eb"/>
  <rect width="960" height="390" fill="url(#voi-steps-dots)" opacity="0.42"/>

  <text x="48" y="48" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">多打听之前，先过这几步</text>

  <g fill="none" stroke="#0f6e6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 218 H187"/><path d="M181 213 L188 218 L181 223"/>
    <path d="M324 218 H335"/><path d="M329 213 L336 218 L329 223"/>
    <path d="M472 218 H483"/><path d="M477 213 L484 218 L477 223"/>
    <path d="M620 218 H631"/><path d="M625 213 L632 218 L625 223"/>
    <path d="M768 218 H779"/><path d="M773 213 L780 218 L773 223"/>
  </g>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="44" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="192" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="340" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="488" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="636" y="104" width="132" height="228" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <rect x="784" y="104" width="132" height="228" rx="8" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.46"/>

    <circle cx="110" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="258" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="406" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="554" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="702" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.10"/>
    <circle cx="850" cy="154" r="22" fill="#0f6e6b" fill-opacity="0.14"/>
    <text x="110" y="161" fill="#0f6e6b" font-size="18" font-weight="700">1</text>
    <text x="258" y="161" fill="#0f6e6b" font-size="18" font-weight="700">2</text>
    <text x="406" y="161" fill="#0f6e6b" font-size="18" font-weight="700">3</text>
    <text x="554" y="161" fill="#0f6e6b" font-size="18" font-weight="700">4</text>
    <text x="702" y="161" fill="#0f6e6b" font-size="18" font-weight="700">5</text>
    <text x="850" y="161" fill="#0f6e6b" font-size="18" font-weight="700">6</text>

    <text x="110" y="218" fill="#1c1917" font-size="14" font-weight="600">写下现在</text>
    <text x="110" y="244" fill="#1c1917" font-size="14" font-weight="600">的决定</text>
    <text x="110" y="280" fill="#78716c" font-size="11">买 / 不买</text>
    <text x="110" y="300" fill="#78716c" font-size="11">粗概率</text>

    <text x="258" y="218" fill="#1c1917" font-size="14" font-weight="600">可能听到</text>
    <text x="258" y="244" fill="#1c1917" font-size="14" font-weight="600">的结果</text>
    <text x="258" y="280" fill="#78716c" font-size="11">好消息</text>
    <text x="258" y="300" fill="#78716c" font-size="11">坏消息</text>

    <text x="406" y="218" fill="#1c1917" font-size="14" font-weight="600">会改</text>
    <text x="406" y="244" fill="#1c1917" font-size="14" font-weight="600">决定吗</text>
    <text x="406" y="280" fill="#78716c" font-size="11">都不改</text>
    <text x="406" y="300" fill="#78716c" font-size="11">→ 价值 0</text>

    <text x="554" y="218" fill="#1c1917" font-size="14" font-weight="600">改了能</text>
    <text x="554" y="244" fill="#1c1917" font-size="14" font-weight="600">好多少</text>
    <text x="554" y="280" fill="#78716c" font-size="11">算上限</text>
    <text x="554" y="300" fill="#78716c" font-size="11">（EVPI）</text>

    <text x="702" y="218" fill="#1c1917" font-size="14" font-weight="600">打听代价</text>
    <text x="702" y="244" fill="#1c1917" font-size="14" font-weight="600">对比</text>
    <text x="702" y="280" fill="#78716c" font-size="11">钱 · 时间</text>
    <text x="702" y="300" fill="#78716c" font-size="11">机会成本</text>

    <text x="850" y="218" fill="#1c1917" font-size="14" font-weight="600">不完美</text>
    <text x="850" y="244" fill="#1c1917" font-size="14" font-weight="600">信息打折</text>
    <text x="850" y="280" fill="#78716c" font-size="11">≤ EVPI</text>
    <text x="850" y="300" fill="#78716c" font-size="11">再打折</text>
  </g>

  <text x="48" y="368" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">上限明显低于打听成本，就可以停；安心不等于能多赚</text>
  <text x="912" y="368" fill="#78716c" font-size="11" text-anchor="end" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">数量级比较即可</text>
</svg>
