<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rtm-control-title rtm-control-desc">
  <title id="rtm-control-title">对照设计：拆开自然回归与干预作用</title>
  <desc id="rtm-control-desc">示意数据。最差30人随机分两组，两组都回升；不补组的回升是自然回归，补习组多出来的一截才是课程作用。</desc>
  <defs><pattern id="rtm-control-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.09"/></pattern></defs>
  <rect width="960" height="540" fill="#f7f3eb"/><rect width="960" height="540" fill="url(#rtm-control-dots)" opacity="0.45"/>

<text x="48.0" y="44.0" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">最差 30 人随机分两半：涨幅怎么拆（示意数据）</text>
<line x1="90" y1="420.0" x2="600" y2="420.0" stroke="#1c1917" stroke-opacity="0.2"/>
<text x="80.0" y="424.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">40</text>
<line x1="90" y1="310.0" x2="600" y2="310.0" stroke="#1c1917" stroke-opacity="0.06"/>
<text x="80.0" y="314.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">50</text>
<line x1="90" y1="200.0" x2="600" y2="200.0" stroke="#1c1917" stroke-opacity="0.06"/>
<text x="80.0" y="204.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">60</text>
<line x1="90" y1="90.0" x2="600" y2="90.0" stroke="#1c1917" stroke-opacity="0.06"/>
<text x="80.0" y="94.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">70</text>
<text transform="translate(44 255.0) rotate(-90)" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">组平均分</text>
<rect x="150" y="288.0" width="70" height="132.0" fill="#57534e" fill-opacity="0.18" stroke="#57534e" stroke-opacity="0.5"/>
<rect x="232" y="222.0" width="70" height="198.0" fill="#57534e" fill-opacity="0.6"/>
<text x="185.0" y="280.0" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">52</text>
<text x="267.0" y="214.0" fill="#57534e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">58</text>
<text x="185.0" y="438.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">加练前</text>
<text x="267.0" y="438.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">一个月后</text>
<text x="226.0" y="462.0" fill="#1c1917" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">照常（对照）</text>
<rect x="390" y="288.0" width="70" height="132.0" fill="#0f6e6b" fill-opacity="0.18" stroke="#0f6e6b" stroke-opacity="0.5"/>
<rect x="472" y="167.0" width="70" height="253.0" fill="#0f6e6b" fill-opacity="0.6"/>
<text x="425.0" y="280.0" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">52</text>
<text x="507.0" y="159.0" fill="#0f6e6b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">63</text>
<text x="425.0" y="438.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">加练前</text>
<text x="507.0" y="438.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">一个月后</text>
<text x="466.0" y="462.0" fill="#0f6e6b" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">进加练班</text>
<line x1="150" y1="222.0" x2="560" y2="222.0" stroke="#1c1917" stroke-opacity="0.3" stroke-dasharray="4 4"/>
<line x1="150" y1="288.0" x2="560" y2="288.0" stroke="#1c1917" stroke-opacity="0.15" stroke-dasharray="2 4"/>
<path d="M560 167.0 h8 V222.0 h-8" fill="none" stroke="#0f6e6b" stroke-width="1.6"/>
<text x="578.0" y="192.5" fill="#0f6e6b" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">课程作用 ≈ 5 分</text>
<text x="578.0" y="210.5" fill="#57534e" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">两组之差</text>
<path d="M560 226.0 h8 V288.0 h-8" fill="none" stroke="#57534e" stroke-width="1.6"/>
<text x="578.0" y="255.0" fill="#57534e" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">自然回归 ≈ 6 分</text>
<text x="578.0" y="273.0" fill="#57534e" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">不补也会涨</text>
<rect x="700" y="96" width="220" height="300" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-opacity="0.15"/>
<text x="720.0" y="132.0" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">只看加练班</text>
<text x="720.0" y="158.0" fill="#57534e" font-size="13" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">涨了 11 分，</text>
<text x="720.0" y="184.0" fill="#57534e" font-size="13" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">容易全记成课程功劳</text>
<text x="720.0" y="220.0" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">有了对照组</text>
<text x="720.0" y="246.0" fill="#57534e" font-size="13" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">11 = 6（回归）+ 5（课程）</text>
<text x="720.0" y="282.0" fill="#0f6e6b" font-size="13" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">关键：两组都因</text>
<text x="720.0" y="308.0" fill="#0f6e6b" font-size="13" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">「最差」被挑中，</text>
<text x="720.0" y="334.0" fill="#0f6e6b" font-size="13" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">再随机分组</text>
<line x1="40" y1="478" x2="920" y2="478" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="40.0" y="506.0" fill="#57534e" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start">浅色柱为加练前，深色柱为一个月后</text>
<text x="920.0" y="506.0" fill="#78716c" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">示意数据 · 非真实测量</text>
</svg>