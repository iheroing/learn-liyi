<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pairs-title pairs-desc" id="wr1108-pairs">
  <title id="pairs-title">三对容易混的课：样本、乐观、退路</title>
  <desc id="pairs-desc">左：回归均值靠对照，幸存者偏差靠找回缺口。中：规划谬误管工期数字，事前验尸管失败原因。右：BATNA和换通道核实都是离开眼前的框，走事先准备好的路。</desc>
  <defs>
    <pattern id="pairs-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#f7f3eb"/>
  <rect width="960" height="540" fill="url(#pairs-dots)" opacity="0.45"/>

  <text x="480" y="42" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">最容易混的三对，先分开再叠用</text>

  <!-- Panel 1 -->
  <rect x="40" y="64" width="280" height="296" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="56" y="80" width="168" height="22" rx="4" fill="#0f6e6b" fill-opacity="0.12"/>
  <text x="140" y="96" fill="#0f6e6b" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回归均值 × 幸存者偏差</text>
  <text x="180" y="132" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">都是样本在骗你</text>

  <text x="180" y="168" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">幸存者偏差</text>
  <text x="180" y="190" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">样本缺了一块</text>
  <text x="180" y="210" fill="#0f6e6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">把缺口找回来</text>

  <line x1="68" y1="228" x2="292" y2="228" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>

  <text x="180" y="258" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回归均值</text>
  <text x="180" y="280" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">极端值里有随机起伏</text>
  <text x="180" y="300" fill="#0f6e6b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">要有同样被挑出的对照</text>
  <text x="180" y="336" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">关掉的基金 ≠ 处理后回升</text>

  <!-- Panel 2 -->
  <rect x="340" y="64" width="280" height="296" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="356" y="80" width="156" height="22" rx="4" fill="#3d4f66" fill-opacity="0.14"/>
  <text x="434" y="96" fill="#3d4f66" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">规划谬误 × 事前验尸</text>
  <text x="480" y="132" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">都在对付「这回肯定行」</text>

  <text x="480" y="168" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">规划谬误</text>
  <text x="480" y="190" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管数字：工期从哪来</text>
  <text x="480" y="210" fill="#3d4f66" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">锚到同类事实际分布</text>

  <line x1="368" y1="228" x2="592" y2="228" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>

  <text x="480" y="258" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">事前验尸</text>
  <text x="480" y="280" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管原因：坑会出在哪</text>
  <text x="480" y="300" fill="#3d4f66" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">假设已失败，当场改计划</text>
  <text x="480" y="336" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">两件能叠：先估对，再找坑</text>

  <!-- Panel 3 -->
  <rect x="640" y="64" width="280" height="296" rx="8" fill="#f7f3eb" stroke="#1c1917" stroke-width="1" stroke-opacity="0.18"/>
  <rect x="656" y="80" width="148" height="22" rx="4" fill="#9a3412" fill-opacity="0.12"/>
  <text x="730" y="96" fill="#9a3412" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">BATNA × 换通道核实</text>
  <text x="780" y="132" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">都是离开眼前这个框</text>

  <text x="780" y="168" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">BATNA</text>
  <text x="780" y="190" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">谈不成你去做什么</text>
  <text x="780" y="210" fill="#9a3412" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">上桌前算成一个数</text>

  <line x1="668" y1="228" x2="892" y2="228" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>

  <text x="780" y="258" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">换通道核实</text>
  <text x="780" y="280" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">要钱或改账户别在原线核实</text>
  <text x="780" y="300" fill="#9a3412" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">挂断，用自己存的号打回</text>
  <text x="780" y="336" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">嘴上能拒绝 ≠ 真做过准备</text>

  <!-- Bottom -->
  <rect x="40" y="386" width="880" height="72" rx="8" fill="#3f6212" fill-opacity="0.10" stroke="#3f6212" stroke-width="1.4"/>
  <text x="480" y="416" fill="#3f6212" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">先改你最常踩的那一对</text>
  <text x="480" y="440" fill="#57534e" font-size="13" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">被成功故事带跑 · 把回升当成干预有效 · 工期总偏短 · 会上没人说坑 · 没退路就开谈 · 在对方线上核实</text>

  <line x1="40" y1="480" x2="920" y2="480" stroke="#1c1917" stroke-width="0.8" stroke-opacity="0.10"/>
  <text x="40" y="508" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>
  <rect x="96" y="496" width="16" height="12" fill="#0f6e6b" fill-opacity="0.12" stroke="#0f6e6b" stroke-width="1.2"/>
  <text x="118" y="508" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">分开机制</text>
  <rect x="200" y="496" width="16" height="12" fill="#3f6212" fill-opacity="0.10" stroke="#3f6212" stroke-width="1.2"/>
  <text x="222" y="508" fill="#57534e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">先改一对</text>
  <text x="920" y="508" fill="#78716c" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">机制示意 · 非数据图</text>
</svg>
