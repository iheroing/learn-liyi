<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pm-rule-title pm-rule-desc">
  <title id="pm-rule-title">复用会把泄露从一处传到另一处</title>
  <desc id="pm-rule-desc">这种攻击常被叫做凭证填充或撞库（password stuffing）：拿已经泄露的账号密码，去试同一个用户的其他网站。如果多处共用同一组密码，一个不怎么重要的网站泄露「邮箱 + 密码」后，对方可以拿同一组打开邮箱，再用重置信改掉银行和支付。如果每个账号各用各的，同一处泄露会停在原网站，打不开邮箱和银行。密码管理器做三件事：生成一个又长又乱、只用于这一个网站的密码；把它们加密保存起来；通常只在对得上的网站才自动填入，这能减少把密码打进仿冒页面。你需要记住的，只剩打开它的主密码，并给管理器打开两步验证。</desc>
  <defs>
    <pattern id="pm-rule-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
    <marker id="pm-rule-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#b45309"/>
    </marker>
    <marker id="pm-rule-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#0f6e6b"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#f7f3eb"/>
  <rect width="960" height="680" fill="url(#pm-rule-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">复用会把泄露从一处传到另一处</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">凭证填充 / 撞库 · password stuffing</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="864" height="200" rx="8" fill="#fffdf8" stroke="#b45309" stroke-opacity="0.35"/>
    <text x="68" y="114" fill="#1c1917" font-size="15" font-weight="600">如果多处共用同一组密码</text>
    <text x="68" y="136" fill="#57534e" font-size="12">一处被拿到，就可以拿它去试你的其他账号</text>

    <rect x="68" y="156" width="240" height="104" rx="6" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.28"/>
    <text x="188" y="192" fill="#57534e" font-size="12" text-anchor="middle">不怎么重要的网站</text>
    <text x="188" y="216" fill="#1c1917" font-size="14" font-weight="600" text-anchor="middle">泄露「邮箱 + 密码」</text>
    <text x="188" y="240" fill="#78716c" font-size="12" text-anchor="middle">网站本身可能并不关键</text>

    <line x1="308" y1="208" x2="348" y2="208" stroke="#b45309" stroke-width="1.6" marker-end="url(#pm-rule-arrow-amber)"/>

    <rect x="356" y="156" width="240" height="104" rx="6" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.28"/>
    <text x="476" y="192" fill="#57534e" font-size="12" text-anchor="middle">拿同一组去撞</text>
    <text x="476" y="216" fill="#1c1917" font-size="14" font-weight="600" text-anchor="middle">邮箱被打开</text>
    <text x="476" y="240" fill="#78716c" font-size="12" text-anchor="middle">邮箱是许多账号的重置入口</text>

    <line x1="596" y1="208" x2="636" y2="208" stroke="#b45309" stroke-width="1.6" marker-end="url(#pm-rule-arrow-amber)"/>

    <rect x="644" y="156" width="244" height="104" rx="6" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.28"/>
    <text x="766" y="192" fill="#57534e" font-size="12" text-anchor="middle">再用重置信</text>
    <text x="766" y="216" fill="#1c1917" font-size="14" font-weight="600" text-anchor="middle">改掉银行和支付</text>
    <text x="766" y="240" fill="#78716c" font-size="12" text-anchor="middle">绑在这封邮箱上的服务也会受影响</text>

    <rect x="48" y="300" width="864" height="128" rx="8" fill="#fffdf8" stroke="#0f6e6b" stroke-opacity="0.40"/>
    <text x="68" y="330" fill="#1c1917" font-size="15" font-weight="600">如果每个账号各用各的</text>
    <text x="68" y="352" fill="#57534e" font-size="12">同一处泄露，会停在原来那个网站</text>

    <rect x="68" y="368" width="384" height="42" rx="6" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.28"/>
    <text x="260" y="394" fill="#1c1917" font-size="14" text-anchor="middle">那个网站的密码被拿到了</text>

    <line x1="452" y1="389" x2="500" y2="389" stroke="#0f6e6b" stroke-width="1.6" marker-end="url(#pm-rule-arrow-teal)"/>

    <rect x="508" y="368" width="384" height="42" rx="6" fill="#0f6e6b" fill-opacity="0.07" stroke="#0f6e6b" stroke-opacity="0.28"/>
    <text x="700" y="394" fill="#1c1917" font-size="14" text-anchor="middle">邮箱和银行仍是各自的密码，打不开</text>

    <rect x="48" y="444" width="864" height="204" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="474" fill="#1c1917" font-size="15" font-weight="600">密码管理器做三件事，你只记一把主密码</text>
    <text x="68" y="496" fill="#57534e" font-size="12">CISA 的建议：够长、随机、每个账号不同；自己记不住，就用管理器。生成密码默认至少 16 位。</text>

    <rect x="68" y="514" width="256" height="110" rx="6" fill="#f7f3eb"/>
    <circle cx="88" cy="538" r="14" fill="#0f6e6b" fill-opacity="0.12"/>
    <text x="88" y="543" fill="#0f6e6b" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="110" y="543" fill="#1c1917" font-size="14" font-weight="600">生成</text>
    <text x="84" y="572" fill="#44403c" font-size="13">又长又乱、只用于</text>
    <text x="84" y="594" fill="#44403c" font-size="13">这一个网站的密码</text>

    <rect x="340" y="514" width="256" height="110" rx="6" fill="#f7f3eb"/>
    <circle cx="360" cy="538" r="14" fill="#0f6e6b" fill-opacity="0.12"/>
    <text x="360" y="543" fill="#0f6e6b" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="382" y="543" fill="#1c1917" font-size="14" font-weight="600">保存</text>
    <text x="356" y="572" fill="#44403c" font-size="13">加密存起来，你只记</text>
    <text x="356" y="594" fill="#44403c" font-size="13">一把主密码，并打开两步验证</text>

    <rect x="612" y="514" width="276" height="110" rx="6" fill="#f7f3eb"/>
    <circle cx="632" cy="538" r="14" fill="#0f6e6b" fill-opacity="0.12"/>
    <text x="632" y="543" fill="#0f6e6b" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="654" y="543" fill="#1c1917" font-size="14" font-weight="600">填充</text>
    <text x="628" y="572" fill="#44403c" font-size="13">通常只在对得上的网站</text>
    <text x="628" y="594" fill="#44403c" font-size="13">才自动填入，减少填进仿冒页</text>
  </g>
</svg>
