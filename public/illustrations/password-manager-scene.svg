<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pm-scene-title pm-scene-desc">
  <title id="pm-scene-title">一个网站泄露后，重复使用的密码会被拿去撞别的账号</title>
  <desc id="pm-scene-desc">假设的情况，来自美国网络安全局（CISA）面向公众的密码建议里用过的例子。左侧：有人收到银行短信，说有一笔 700 美元转账她没申请。她想登录银行取消，密码已经失效；再想通过邮箱拿重置链接，邮箱也进不去。右侧：后来才知道，她在邮箱和银行用了同一个密码，而这组密码出现在另一家公司的泄露名单上。一个本来不怎么重要的网站把「邮箱 + 密码」漏了出去，有人拿同一组去撞更重要的账号。底部说明：邮箱一旦被打开，重置信就能改掉银行、网盘，以及绑在这封邮箱上的其他服务。</desc>
  <defs>
    <pattern id="pm-scene-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1c1917" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#f7f3eb"/>
  <rect width="960" height="560" fill="url(#pm-scene-dots)" opacity="0.42"/>

  <text x="48" y="40" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">一个网站泄露后，重复使用的密码会被拿去撞别的账号</text>
  <text x="48" y="62" fill="#57534e" font-size="12" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">美国网络安全局（CISA）面向公众建议里用过的例子</text>

  <g font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="48" y="84" width="420" height="356" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="118" fill="#1c1917" font-size="15" font-weight="600">当时遇到的情况</text>
    <text x="68" y="140" fill="#57534e" font-size="12">先是银行，接着邮箱也进不去</text>

    <rect x="68" y="160" width="380" height="86" rx="6" fill="#f7f3eb"/>
    <text x="84" y="186" fill="#57534e" font-size="12">收到银行短信</text>
    <text x="84" y="210" fill="#1c1917" font-size="14">有一笔 700 美元转账，她没申请</text>
    <text x="84" y="230" fill="#78716c" font-size="12">想登录银行取消这笔转账</text>

    <rect x="68" y="260" width="380" height="154" rx="6" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.28"/>
    <text x="84" y="288" fill="#57534e" font-size="12">可是账户已经进不去</text>
    <text x="84" y="314" fill="#1c1917" font-size="14">登录银行时，密码已经失效</text>
    <text x="84" y="338" fill="#1c1917" font-size="14">再想通过邮箱拿重置链接，</text>
    <text x="84" y="360" fill="#1c1917" font-size="14">邮箱也进不去</text>
    <text x="84" y="390" fill="#78716c" font-size="12">两条最常用的入口，同时失效了</text>

    <rect x="492" y="84" width="420" height="356" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="512" y="118" fill="#1c1917" font-size="15" font-weight="600">后来才知道原因</text>
    <text x="512" y="140" fill="#57534e" font-size="12">邮箱和银行，用的是同一组密码</text>

    <rect x="512" y="160" width="380" height="86" rx="6" fill="#f7f3eb"/>
    <text x="528" y="186" fill="#57534e" font-size="12">这组密码从别处漏了出去</text>
    <text x="528" y="210" fill="#1c1917" font-size="14">它出现在另一家公司的泄露名单上</text>
    <text x="528" y="230" fill="#78716c" font-size="12">那个网站本身，本来不怎么重要</text>

    <rect x="512" y="260" width="380" height="154" rx="6" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.28"/>
    <text x="528" y="288" fill="#57534e" font-size="12">有人拿同一组去撞更重要的账号</text>
    <text x="528" y="314" fill="#1c1917" font-size="14">先打开邮箱，再改掉银行密码</text>
    <text x="528" y="338" fill="#1c1917" font-size="14">所以银行密码会失效，</text>
    <text x="528" y="360" fill="#1c1917" font-size="14">重置邮件也到不了她手里</text>
    <text x="528" y="390" fill="#78716c" font-size="12">复杂主要防的是被猜，防不住被拿到</text>

    <rect x="48" y="460" width="864" height="68" rx="8" fill="#fffdf8" stroke="#1c1917" stroke-opacity="0.16"/>
    <text x="68" y="491" fill="#1c1917" font-size="15" font-weight="600">邮箱一旦被打开，重置信就能改掉银行、网盘，以及绑在这封邮箱上的其他服务</text>
    <text x="68" y="513" fill="#57534e" font-size="12">一个网站泄露，不该能直接打开你的邮箱和支付</text>
  </g>
</svg>
